name: CI
on: [push, pull_request]
jobs:
  plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pydantic
      - run: python -m pytest tests -q
        working-directory: backend
